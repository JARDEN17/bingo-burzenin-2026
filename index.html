<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINGO BURZENIN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }

        .reset-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 25px;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background-color: #bd2130;
        }

        /* Siatka Bingo 4x4 */
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            max-width: 550px;
            width: 100%;
            background-color: #fff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* Styl pojedynczego pola */
        .bingo-cell {
            background-color: #e9ecef;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            user-select: none;
            word-break: break-word;
        }

        .bingo-cell:hover {
            background-color: #dee2e6;
            transform: scale(1.02);
        }

        /* Styl dla zaznaczonego pola */
        .bingo-cell.selected {
            background-color: #28a745;
            color: white;
            border-color: #1e7e34;
            text-decoration: line-through;
        }

        @media (max-width: 480px) {
            .bingo-cell {
                font-size: 0.7rem;
                padding: 6px;
            }
            .bingo-board {
                gap: 6px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <h1>Bingo Burzenin 2026</h1>
    <button class="reset-btn" id="resetBtn">RESET</button>

    <div class="bingo-board">
        <!-- Rząd 1 -->
        <div class="bingo-cell" data-id="1">Cegła + Michalina = 💖</div>
        <div class="bingo-cell" data-id="2">Powstanie nowego shipu</div>
        <div class="bingo-cell" data-id="3">Beef</div>
        <div class="bingo-cell" data-id="4">Hoszuf i orzesze się połączą</div>

        <!-- Rząd 2 -->
        <div class="bingo-cell" data-id="5">Ktoś coś złamie</div>
        <div class="bingo-cell" data-id="6">Ktoś dostanie karniaka</div>
        <div class="bingo-cell" data-id="7">Ktoś zwyzywa kogoś dla beki a on się poryczy</div>
        <div class="bingo-cell" data-id="8">Wielki powrót LA</div>

        <!-- Rząd 3 -->
        <div class="bingo-cell" data-id="9">M&M</div>
        <div class="bingo-cell" data-id="10">Kacper będzie z Nataszą</div>
        <div class="bingo-cell" data-id="11">...</div>
        <div class="bingo-cell" data-id="12">...</div>

        <!-- Rząd 4 -->
        <div class="bingo-cell" data-id="13">...</div>
        <div class="bingo-cell" data-id="14">...</div>
        <div class="bingo-cell" data-id="15">...</div>
        <div class="bingo-cell" data-id="16">...</div>
    </div>

    <script>
        const cells = document.querySelectorAll('.bingo-cell');
        const resetBtn = document.getElementById('resetBtn');

        function loadBingoState() {
            const savedState = localStorage.getItem('bingoState4x4');
            if (savedState) {
                const checkedIds = JSON.parse(savedState);
                cells.forEach(cell => {
                    const id = cell.getAttribute('data-id');
                    if (checkedIds.includes(id)) {
                        cell.classList.add('selected');
                    }
                });
            }
        }

        function saveBingoState() {
            const checkedIds = [];
            cells.forEach(cell => {
                if (cell.classList.contains('selected')) {
                    checkedIds.push(cell.getAttribute('data-id'));
                }
            });
            localStorage.setItem('bingoState4x4', JSON.stringify(checkedIds));
        }

        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                cell.classList.toggle('selected');
                saveBingoState();
            });
        });

        resetBtn.addEventListener('click', () => {
            cells.forEach(cell => {
                cell.classList.remove('selected');
            });
            saveBingoState();
        });

        document.addEventListener('DOMContentLoaded', loadBingoState);
    </script>

</body>
</html>
